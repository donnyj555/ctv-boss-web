<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CTV Homes — icon generator</title>
<style>
  body{margin:0;padding:2.5rem 1.5rem;background:#0a0a0f;color:#fcfcfd;
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto}
  h1{font-size:1.6rem;margin:0 0 .4rem}
  p{color:#a0a0ab;margin:0 0 1.5rem;max-width:60ch}
  .row{display:flex;flex-wrap:wrap;gap:1.25rem;margin-bottom:2rem}
  .card{background:#13131c;border:1px solid rgba(255,255,255,.1);border-radius:12px;
        padding:1rem;display:flex;flex-direction:column;align-items:center;gap:.6rem}
  canvas{background:#0a0a0f;border-radius:8px;image-rendering:auto}
  .name{font-size:.78rem;color:#a0a0ab;font-family:ui-monospace,monospace}
  button{background:#ff3366;color:#fff;border:0;border-radius:8px;padding:.55rem 1rem;
         font-weight:600;font-size:.85rem;cursor:pointer;font-family:inherit}
  button:hover{opacity:.9}
  button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .all{padding:.8rem 1.5rem;font-size:1rem}
  code{background:#1c1c28;padding:.15em .45em;border-radius:4px;font-size:.85em}
</style>
</head>
<body>
<div class="wrap">
  <h1>CTV Homes icon generator</h1>
  <p>Open this file in a browser, click <strong>Download all</strong>, and drop the three PNGs into
  your app's <code>public/</code> folder. Nothing is uploaded anywhere — the drawing happens in
  this page and the files save straight to your Downloads.</p>

  <button class="all" id="all">Download all three</button>

  <div class="row" id="row"></div>
</div>

<script>
// Sizes the manifest and iOS actually ask for. 180 is apple-touch-icon;
// 192 and 512 are the manifest entries (512 doubles as the maskable source).
const SIZES = [
  { px: 180, file: 'apple-touch-icon.png' },
  { px: 192, file: 'icon-192.png' },
  { px: 512, file: 'icon-512.png' },
];

const SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0a0a0f"/>
  <path d="M256 118 L406 214 H106 Z" fill="#ff3366"/>
  <rect x="106" y="232" width="300" height="196" rx="26" fill="none" stroke="#ff3366" stroke-width="22"/>
  <path d="M226 296 L316 330 L226 364 Z" fill="#fcfcfd"/>
  <rect x="216" y="446" width="80" height="18" rx="9" fill="#ff3366"/>
</svg>`;

const img = new Image();
img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG);

const canvases = {};

img.onload = () => {
  const row = document.getElementById('row');
  for (const { px, file } of SIZES) {
    const card = document.createElement('div');
    card.className = 'card';

    const c = document.createElement('canvas');
    c.width = c.height = px;
    // preview capped so a 512 tile doesn't dominate the page
    c.style.width = c.style.height = Math.min(px, 160) + 'px';
    c.getContext('2d').drawImage(img, 0, 0, px, px);
    canvases[file] = c;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = px + '×' + px + ' · ' + file;

    const btn = document.createElement('button');
    btn.textContent = 'Download';
    btn.onclick = () => save(file);

    card.append(c, name, btn);
    row.append(card);
  }
};

function save(file) {
  canvases[file].toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
}

// Browsers throttle rapid programmatic downloads, so stagger them.
document.getElementById('all').onclick = () => {
  SIZES.forEach(({ file }, i) => setTimeout(() => save(file), i * 400));
};
</script>
</body>
</html>
